spring:
  application:
    name: paypal-sandbox
  datasource:
    url: jdbc:h2:mem:sandbox;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=60000
    username: sa
    password:
    hikari:
      # 커넥션 풀 고갈 실험을 위해 일부러 작게 잡는다.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    # OSIV를 켜 두면 요청이 끝날 때까지 커넥션을 쥐고 있어서 트랜잭션 분리 효과가 사라진다.
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

pg:
  # 주문을 만들 때 PG를 고르지 않으면 쓰는 기본값. eximbay 또는 paypal.
  provider: ${PG_PROVIDER:eximbay}
  paypal:
    base-url: https://api-m.sandbox.paypal.com
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
    return-url: ${PAYPAL_RETURN_URL:http://localhost:8080/checkout-return.html}
    cancel-url: ${PAYPAL_CANCEL_URL:http://localhost:8080/checkout.html?cancelled=1}
    connect-timeout: 3s
    read-timeout: 10s
  eximbay:
    base-url: ${EXIMBAY_BASE_URL:https://api-test.eximbay.com}
    # 기본값은 엑심베이 개발자 문서에 공개된 공용 테스트 가맹점이다. 계약 전에도 테스트할 수 있다.
    mid: ${EXIMBAY_MID:1849705C64}
    api-key: ${EXIMBAY_API_KEY:test_1849705C642C217E0B2D}
    return-url: ${EXIMBAY_RETURN_URL:http://localhost:8080/eximbay/return}
    # 엑심베이 서버가 직접 부르는 주소라 localhost로는 받을 수 없다. 받으려면 터널 주소로 바꾼다.
    status-url: ${EXIMBAY_STATUS_URL:http://localhost:8080/eximbay/status}
    lang: EN
    connect-timeout: 3s
    read-timeout: 10s

reconcile:
  # 결제 중이거나 결과를 모르는 주문을 이 시간이 지난 뒤에 대사한다.
  stale-after: 30s
  schedule-enabled: ${RECONCILE_SCHEDULE_ENABLED:false}
  fixed-delay: 60s
