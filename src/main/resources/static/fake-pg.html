<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테스트 PG 결제</title>
<link rel="stylesheet" href="/assets/shop.css">
<style>
  body { background: var(--surface); }
  .pg { max-width: 420px; margin: 48px auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pg-head { padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; justify-content: space-between; }
  .pg-head span { font-weight: 400; color: var(--muted); font-size: 13px; }
  .pg-body { padding: 20px; }
  .amount { font-size: 28px; font-weight: 600; margin: 4px 0 16px; }
  @media (max-width: 460px) { .pg { margin: 16px; } }
</style>
</head>
<body>
<div class="pg">
  <div class="pg-head">테스트 PG <span>Sandbox Store 결제</span></div>
  <div class="pg-body" id="content"><div class="spinner"></div></div>
</div>

<script src="/assets/shop.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');

async function load() {
  const el = document.getElementById('content');
  try {
    const order = await Shop.api('GET', `/checkout/pg-orders/${encodeURIComponent(token)}`);
    el.innerHTML = `
      <div class="muted">결제 금액</div>
      <div class="amount">${Shop.money(order.amount)}</div>
      <dl class="kv" style="grid-template-columns:90px 1fr;margin-bottom:20px">
        <dt>주문번호</dt><dd>#${order.id}</dd>
        <dt>상품</dt><dd>${order.lines.map((l) => `${Shop.esc(l.productName)} × ${l.quantity}`).join('<br>')}</dd>
        <dt>PG 주문</dt><dd class="mono">${Shop.esc(token)}</dd>
      </dl>
      <button class="primary btn-block" id="approve">결제 승인</button>
      <button class="btn-block" id="cancel" style="margin-top:8px">취소</button>
      <p class="muted" style="font-size:12px;margin:14px 0 0">로컬 가짜 PG 화면입니다. 승인해도 실제 결제는 일어나지 않습니다.</p>`;
    document.getElementById('approve').addEventListener('click', () => {
      location.replace(`/checkout-return.html?token=${encodeURIComponent(token)}`);
    });
    document.getElementById('cancel').addEventListener('click', () => {
      location.replace(`/checkout.html?cancelled=1&token=${encodeURIComponent(token)}`);
    });
  } catch (e) {
    el.innerHTML = `<div class="notice bad">결제 정보를 찾을 수 없습니다. ${Shop.esc(e.message)}</div>`;
  }
}
load();
</script>
</body>
</html>
